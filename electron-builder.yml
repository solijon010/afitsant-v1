appId: uz.hisobchim.pos
productName: Hisobchim POS
copyright: Copyright © 2026 Hisobchim

directories:
  buildResources: build
  output: dist-app

files:
  - out/**/*
  - package.json
  - '!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,test,__tests__,tests,powered-test,example,examples}'
  - '!**/node_modules/.bin'
  - '!**/*.{map,md,markdown,ts}'

asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/bcryptjs/**'

extraResources:
  - from: src/assets/hisobchim-logo.ico
    to: hisobchim-logo.ico
  - from: src/assets/receipt-header-thermal-clean.png
    to: receipt-header-thermal-clean.png
  - from: src/assets/receipt-header-thermal.png
    to: receipt-header-thermal.png
  - from: src/assets/receipt-header.png
    to: receipt-header.png

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: src/assets/hisobchim-logo.ico
  artifactName: Hisobchim-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Hisobchim POS

portable:
  artifactName: Hisobchim-${version}-portable.exe

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Office
  artifactName: Hisobchim-${version}-${arch}.${ext}

deb:
  depends:
    - libusb-1.0-0
  afterInstall: build/after-install.sh

publish: null
